{{define "title"}}{{t "login_title"}}{{end}}
{{define "width"}}col-12 col-md-8 col-lg-6 col-xl-5{{end}}

{{define "content"}}

<div class="mx-auto text-start" style="max-width: 420px;">
    {{if .Data.GoogleEnabled}}
    <a href="/auth/google" class="btn btn-lg w-100 mb-3"><i class="ti ti-brand-google me-2"></i>{{t "login_google"}}</a>
    <div class="hr-text">{{t "login_or"}}</div>
    {{end}}
    <form action="/login" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">{{t "login_email"}}</label>
            <input type="email" id="email" name="email" value="{{.Data.Email}}" required autocomplete="username" class="form-control">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">{{t "login_password"}}</label>
            <input type="password" id="password" name="password" required autocomplete="current-password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">{{t "login_submit"}}</button>
    </form>
    <p class="text-secondary small mt-3">{{t "login_invite_only"}}</p>
</div>
{{end}}
