{{define "title"}}{{t "twofa_title"}}{{end}}
{{define "width"}}col-12 col-md-8 col-lg-6 col-xl-5{{end}}

{{define "content"}}

<div class="mx-auto text-start" style="max-width: 420px;">
    {{if .Data.Info}}<div class="alert alert-info">{{.Data.Info}}</div>{{end}}
    <form action="/login/2fa" method="post">
        <div class="mb-3">
            <label for="code" class="form-label">{{t "twofa_code"}}</label>
            <input type="text" id="code" name="code" required autofocus autocomplete="one-time-code" inputmode="text" class="form-control form-control-lg text-center">
            <div class="form-text">{{t "twofa_code_help"}}</div>
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100">{{t "twofa_submit"}}</button>
    </form>
    {{if .Data.EmailEnabled}}
    <form action="/login/2fa/email" method="post" class="mt-3">
        <button type="submit" class="btn btn-link p-0">{{t "twofa_email"}}</button>
    </form>
    {{end}}
    <form action="/logout" method="post" class="mt-2">
        <button type="submit" class="btn btn-link p-0 text-secondary">{{t "twofa_cancel"}}</button>
    </form>
</div>
{{end}}
