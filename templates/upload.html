{{define "title"}}{{t "upload_title"}}{{end}}

{{define "content"}}
<h1>{{t "upload_title"}}</h1>

<form action="/upload" method="post" enctype="multipart/form-data">
    <div class="mb-3 text-start">
        <label for="excelFile" class="form-label">{{t "select_file"}}</label>
        <input type="file" id="excelFile" name="excelFile" accept=".xlsx,.xls" required class="form-control form-control-md">
    </div>
    <button type="submit" class="btn btn-custom btn-lg w-100">{{t "btn_next"}}</button>
</form>

<div class="text-center text-muted small my-3">{{t "login_or"}}</div>

<form action="/eos/load" method="post" class="text-start">
    <label for="eos-period" class="form-label">{{t "eos_load_title"}}</label>
    <div class="input-group">
        <input type="month" id="eos-period" name="period" required class="form-control">
        <button type="submit" class="btn btn-outline-dark">{{t "eos_load"}}</button>
    </div>
    <div class="form-text"><a href="/account/eos">{{t "eos_manage"}}</a></div>
</form>
{{end}}

{{define "scripts"}}
<script>
const period = document.getElementById('eos-period');
if (!period.value) {
    const now = new Date();
    period.value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
}
</script>
{{end}}
