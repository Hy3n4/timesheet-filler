{{define "title"}}{{t "upload_title"}}{{end}}

{{define "content"}}

<form action="/upload" method="post" enctype="multipart/form-data">
    <div class="mb-3 text-start">
        <label for="excelFile" class="form-label">{{t "select_file"}}</label>
        <input type="file" id="excelFile" name="excelFile" accept=".xlsx,.xls" required class="form-control form-control-md">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-100"><i class="ti ti-upload me-2"></i>{{t "btn_next"}}</button>
</form>

<div class="hr-text">{{t "login_or"}}</div>

<form action="/eos/load" method="post" class="text-start">
    <label for="period-month" class="form-label">{{t "eos_load_title"}}</label>
    {{template "period-picker" "period"}}
    <button type="submit" class="btn btn-outline-primary w-100 mt-2"><i class="ti ti-cloud-download me-2"></i>{{t "eos_load"}}</button>
    <div class="form-text"><a href="/account/eos">{{t "eos_manage"}}</a></div>
</form>
{{end}}
