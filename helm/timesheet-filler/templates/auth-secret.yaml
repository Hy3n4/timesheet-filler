{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "timesheet-filler.authSecretName" . }}
  labels:
    {{- include "timesheet-filler.labels" . | nindent 4 }}
type: Opaque
data:
  database-url: {{ required "auth.databaseUrl or auth.existingSecret is required" .Values.auth.databaseUrl | b64enc | quote }}
  secret-keys: {{ required "auth.secretKeys or auth.existingSecret is required" .Values.auth.secretKeys | b64enc | quote }}
  {{- with .Values.auth.google.clientId }}
  google-client-id: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.google.clientSecret }}
  google-client-secret: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
